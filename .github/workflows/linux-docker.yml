# Builds the whole OM project inside the pre-built Docker image
# (ALT p11 + LLVM 23 + all dependencies in /deps/linux-clang23-x86_64).
# See deps/docker/readme.md for how the image is built and published.
name: Linux (Docker, clang23)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Manual runs: every option below defaults to the value from the root
  # CMakeLists.txt, so "Run workflow" with no changes builds everything.
  # NOTE: OM_CLANG_TIDY is intentionally not exposed - clang-tidy is not
  # part of the minimal LLVM set in the image. OM_GAME_EXAMPLE is not
  # exposed either: 05-game fetches SDL2 2.0.22, whose CMakeLists requires
  # cmake_minimum_required(3.0.0), dropped by CMake 4.5.
  workflow_dispatch:
    inputs:
      build_config:
        description: "CMake build configuration"
        type: choice
        options: ["RelWithDebInfo", "Debug", "Release", "MinSizeRel"]
        default: RelWithDebInfo
      om_basic_prog:
        description: "00-basic-prog"
        type: choice
        options: ["ON", "OFF"]
        default: "ON"
      om_basic_game_dev:
        description: "01-basic-game-dev"
        type: choice
        options: ["ON", "OFF"]
        default: "ON"
      om_opengl:
        description: "02-opengl"
        type: choice
        options: ["ON", "OFF"]
        default: "ON"
      om_vulkan:
        description: "02-vulkan"
        type: choice
        options: ["ON", "OFF"]
        default: "ON"
      om_web:
        description: "08-web"
        type: choice
        options: ["ON", "OFF"]
        default: "ON"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ github.event.inputs.build_config || 'RelWithDebInfo' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/leanid/om-deps:linux-clang23
      # only needed while the GHCR package is private
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # push/PR have no inputs: fall back to the CMake defaults
      BUILD_CONFIG: ${{ github.event.inputs.build_config || 'RelWithDebInfo' }}
      OM_BASIC_PROG: ${{ github.event.inputs.om_basic_prog || 'ON' }}
      OM_BASIC_GAME_DEV: ${{ github.event.inputs.om_basic_game_dev || 'ON' }}
      OM_OPENGL: ${{ github.event.inputs.om_opengl || 'ON' }}
      OM_VULKAN: ${{ github.event.inputs.om_vulkan || 'ON' }}
      OM_WEB: ${{ github.event.inputs.om_web || 'ON' }}
      # ccache lives in the workspace, so actions/cache can persist it
      # between runs (the container itself is ephemeral).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      # Bump v1 whenever the Docker image toolchain changes (new LLVM,
      # wrapper scripts, ...), otherwise stale objects could be reused.
      CCACHE_KEY_PREFIX: ccache-v1-linux-clang23
    steps:
      - uses: actions/checkout@v4

      # The container is thrown away after the job; actions/cache stores this
      # archive in GitHub's cache service and restores it on the next run.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY_PREFIX }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CCACHE_KEY_PREFIX }}-

      # The image provides CMAKE_PREFIX_PATH=/deps/linux-clang23-x86_64,
      # VULKAN_SDK and the clang 23 toolchain, so the preset works as-is.
      # Note: no ctest here - the container has no display/GPU.
      - name: Configure
        run: |
          # fail early if the image predates ccache
          ccache --version
          cmake --preset ninja-llvm \
            -DOM_BASIC_PROG="$OM_BASIC_PROG" \
            -DOM_BASIC_GAME_DEV="$OM_BASIC_GAME_DEV" \
            -DOM_OPENGL="$OM_OPENGL" \
            -DOM_VULKAN="$OM_VULKAN" \
            -DOM_WEB="$OM_WEB" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ninja-llvm --config "$BUILD_CONFIG"

      - name: ccache stats
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### OM build"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| build_config | \`$BUILD_CONFIG\` |"
            echo "| OM_BASIC_PROG | \`$OM_BASIC_PROG\` |"
            echo "| OM_BASIC_GAME_DEV | \`$OM_BASIC_GAME_DEV\` |"
            echo "| OM_OPENGL | \`$OM_OPENGL\` |"
            echo "| OM_VULKAN | \`$OM_VULKAN\` |"
            echo "| OM_WEB | \`$OM_WEB\` |"
          } >> "$GITHUB_STEP_SUMMARY"
